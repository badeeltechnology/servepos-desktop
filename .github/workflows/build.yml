name: Build & Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  build-mac:
    runs-on: macos-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci --legacy-peer-deps

      - name: Typecheck application
        run: npm run typecheck

      - name: Test native database migration and recovery
        run: npm run test:database

      - name: Package for macOS
        run: npx electron-builder --mac zip --config electron-builder.yml --publish never

      - name: Upload macOS artifact
        uses: actions/upload-artifact@v4
        with:
          name: ServePOS-macOS
          path: |
            dist/*.zip
            dist/*.dmg
            dist/*.blockmap
            dist/latest-mac.yml

  build-windows:
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci --legacy-peer-deps

      - name: Typecheck application
        run: npm run typecheck

      - name: Test native database migration and recovery
        run: npm run test:database
        timeout-minutes: 3

      - name: Package for Windows (one installer for 32 and 64 bit, used by auto-update)
        run: npx electron-builder --win --config electron-builder.yml --publish never

      - name: Package separate 64-bit and 32-bit installers
        shell: bash
        run: |
          cp dist/latest.yml latest.yml.keep
          npx electron-builder --win nsis --x64 --config electron-builder.yml --publish never -c.nsis.artifactName='${name}-${version}-x64-setup.${ext}'
          npx electron-builder --win nsis --ia32 --config electron-builder.yml --publish never -c.nsis.artifactName='${name}-${version}-ia32-setup.${ext}'
          mv latest.yml.keep dist/latest.yml

      - name: Upload Windows artifact
        uses: actions/upload-artifact@v4
        with:
          name: ServePOS-Windows
          path: |
            dist/*.exe
            dist/*.blockmap
            dist/latest.yml

  release:
    needs: [build-mac, build-windows]
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/v')
    steps:
      - name: Download macOS artifact
        uses: actions/download-artifact@v4
        with:
          name: ServePOS-macOS
          path: dist

      - name: Download Windows artifact
        uses: actions/download-artifact@v4
        with:
          name: ServePOS-Windows
          path: dist

      - name: Create Release on servepos-releases
        uses: softprops/action-gh-release@v2
        with:
          repository: badeeltechnology/servepos-releases
          tag_name: ${{ github.ref_name }}
          name: ${{ github.ref_name }}
          files: dist/*
          draft: false
          prerelease: false
          body: "ServePOS Desktop ${{ github.ref_name }}"
          # action-gh-release v2 reads the token input only; the GITHUB_TOKEN env var is ignored,
          # so the default token (no access to servepos-releases) was used and every release failed.
          token: ${{ secrets.RELEASE_PAT }}
